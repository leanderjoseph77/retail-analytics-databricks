resources:
 jobs:
   retail_analytics_pipeline:
     name: retail_analytics_pipeline
     tasks:
       - task_key: bronze_ingestion
         notebook_task:
           notebook_path: ../src/bronze/01_bronze_ingestion.ipynb
           source: GIT
         environment_key: default
       - task_key: silver_transformation
         depends_on:
           - task_key: bronze_ingestion
         notebook_task:
           notebook_path: ../src/silver/02_silver_transformation.ipynb
           source: GIT
         environment_key: default
       - task_key: gold_transformation
         depends_on:
           - task_key: silver_transformation
         notebook_task:
           notebook_path: ../src/gold/03_Gold_transformation.ipynb
           source: GIT
         environment_key: default
     environments:
       - environment_key: default
         spec:
           environment_version: "4"
